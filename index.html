<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NCLEX-RN Prep Simulator</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- Navigation -->
  <nav class="nav" aria-label="Main navigation">
    <div class="nav__brand">NCLEX Prep</div>
    <div class="nav__links">
      <a href="#dashboard" class="nav__link nav__link--active" data-screen="dashboard" aria-label="Dashboard">
        <svg class="nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Dashboard</span>
      </a>
      <a href="#test-config" class="nav__link" data-screen="test-config" aria-label="Take Test">
        <svg class="nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        <span>Take Test</span>
      </a>
      <a href="#questions" class="nav__link" data-screen="questions" aria-label="Question Bank">
        <svg class="nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
        <span>Questions</span>
      </a>
      <a href="#analytics" class="nav__link" data-screen="analytics" aria-label="Analytics">
        <svg class="nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        <span>Analytics</span>
      </a>
      <a href="#settings" class="nav__link" data-screen="settings" aria-label="Settings">
        <svg class="nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        <span>Settings</span>
      </a>
    </div>
  </nav>

  <!-- Main Content -->
  <main id="main-content" class="main">
    <!-- Toast Container -->
    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <!-- Modal Overlay -->
    <div id="modal-overlay" class="modal-overlay" role="dialog" aria-modal="true">
      <div id="modal-content" class="modal"></div>
    </div>

    <!-- Screens -->
    <section id="screen-dashboard" class="screen screen--active" aria-label="Dashboard">
      <div class="screen__content">
        <div class="screen__loading">Loading...</div>
      </div>
    </section>

    <section id="screen-test-config" class="screen" aria-label="Test Configuration">
      <div class="screen__content">
        <div class="screen__loading">Loading...</div>
      </div>
    </section>

    <section id="screen-test" class="screen" aria-label="Test">
      <div class="screen__content"></div>
    </section>

    <section id="screen-results" class="screen" aria-label="Test Results">
      <div class="screen__content"></div>
    </section>

    <section id="screen-review" class="screen" aria-label="Answer Review">
      <div class="screen__content"></div>
    </section>

    <section id="screen-questions" class="screen" aria-label="Question Bank">
      <div class="screen__content">
        <div class="screen__loading">Loading...</div>
      </div>
    </section>

    <section id="screen-analytics" class="screen" aria-label="Analytics">
      <div class="screen__content"></div>
    </section>

    <section id="screen-settings" class="screen" aria-label="Settings">
      <div class="screen__content">
        <div class="screen__loading">Loading...</div>
      </div>
    </section>
  </main>

  <!-- Scripts (dependency order) -->
  <script src="js/utils.js"></script>
  <script src="js/models.js"></script>
  <script src="js/db.js"></script>
  <script src="js/question-manager.js"></script>
  <script src="js/test-generator.js"></script>
  <script src="js/test-session.js"></script>
  <script src="js/scoring-engine.js"></script>
  <script src="js/adaptive-engine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
